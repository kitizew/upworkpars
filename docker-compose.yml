services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: upwork
      POSTGRES_USER: upwork
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upwork"]
      interval: 3s
      retries: 20

  app:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      CHROME_PROFILE: /profile
      PYTHONUNBUFFERED: "1"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - chrome_profile:/profile
    shm_size: "1gb"
    profiles: ["manual"]
    command: python manage.py migrate

  watcher:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      CHROME_PROFILE: /profile
      PYTHONUNBUFFERED: "1"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - chrome_profile:/profile
    shm_size: "1gb"
    restart: unless-stopped
    profiles: ["watch"]
    command: sh -c "python manage.py migrate && python manage.py watch_jobs --every 15"

  login:
    build: .
    profiles: ["login"]
    ports:
      - "127.0.0.1:6080:6080"
    volumes:
      - chrome_profile:/profile
    shm_size: "1gb"
    command: bash /app/docker/login.sh

volumes:
  pgdata:
  chrome_profile: